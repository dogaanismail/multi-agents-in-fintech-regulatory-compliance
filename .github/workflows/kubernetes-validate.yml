name: Kubernetes Validate

on:
  push:
    branches: [ '**' ]
    paths:
      - 'infrastructure/kubernetes/**'
      - 'libraries/avro-schema-library/schemas/**'
      - '.github/workflows/kubernetes-validate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'infrastructure/kubernetes/**'
      - 'libraries/avro-schema-library/schemas/**'
      - '.github/workflows/kubernetes-validate.yml'

concurrency:
  group: kubernetes-validate-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.0
  KUBECONFORM_VERSION: v0.8.0

jobs:
  validate:
    name: Render and validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML and kubeconform
        run: |
          python -m pip install --quiet pyyaml
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Render every ArgoCD app and validate it
        run: infrastructure/kubernetes/scripts/validate.sh
