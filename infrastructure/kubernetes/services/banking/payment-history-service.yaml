serviceType: java-microservice

image:
  repository: payment-history-svc-api

containerPort: 5005

env:
  SERVER_PORT: 5005
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate

datasource:
  enabled: true
  database: payment_history_db
  credentialsSecret: payment-history-service-db-credentials

messaging:
  enabled: true
  consumes:
    payment-snapshot-events: payment-snapshot-events

migration:
  enabled: true
  image:
    repository: payment-history-svc-db-migration-app
