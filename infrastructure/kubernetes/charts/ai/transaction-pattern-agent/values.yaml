image:
  repository: transaction-pattern-agent

containerPort: 1001

jvm:
  enabled: false

env:
  PORT: 1001
  MODEL_PATH: /app/trained_models
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability:4318

terminationGracePeriodSeconds: 15

probes:
  startup:
    httpGet:
      path: /api/v1/health
  liveness:
    httpGet:
      path: /api/v1/health
  readiness:
    httpGet:
      path: /api/v1/health

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 512Mi
