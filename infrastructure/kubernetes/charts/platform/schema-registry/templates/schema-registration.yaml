apiVersion: v1
kind: ConfigMap
metadata:
  name: avro-schemas
  labels:
    app.kubernetes.io/part-of: bank-solution
    app.kubernetes.io/component: schema-registration
data:
  {{- range $path, $_ := .Files.Glob "schemas/**.avsc" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-registration
  labels:
    app.kubernetes.io/part-of: bank-solution
    app.kubernetes.io/component: schema-registration
data:
  register_schemas.py: |-
    {{- .Files.Get "files/register_schemas.py" | nindent 4 }}
  subjects.json: {{ .Values.schemaRegistration.subjects | toJson | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: schema-registration
  labels:
    app.kubernetes.io/part-of: bank-solution
    app.kubernetes.io/component: schema-registration
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema-registration
          image: {{ .Values.schemaRegistration.image }}
          command:
            - python
            - /opt/registration/register_schemas.py
          env:
            - name: SCHEMA_REGISTRY_URL
              value:
                http://{{ .Chart.Name }}:{{ .Values.containerPort }}
            - name: SCHEMAS_DIRECTORY
              value: /opt/schemas
            - name: SUBJECTS_FILE
              value: /opt/registration/subjects.json
          volumeMounts:
            - name: schemas
              mountPath: /opt/schemas
            - name: registration
              mountPath: /opt/registration
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: schemas
          configMap:
            name: avro-schemas
        - name: registration
          configMap:
            name: schema-registration
