apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: {{ .Values.httpPort }}
      targetPort: http
{{- range .Values.clientNamespaces }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: keycloak-alias
spec:
  type: ExternalName
  externalName: {{ printf "keycloak.%s.svc.cluster.local" $.Release.Namespace }}
  ports:
    - name: http
      port: {{ $.Values.httpPort }}
{{- end }}
