{{- if .Values.createSecrets }}
{{- $secrets := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: {{ required "secrets.adminPassword is required when createSecrets is true" $secrets.adminPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-realm-secrets
stringData:
  BACKOFFICE_CLIENT_SECRET: {{ required "secrets.backofficeClientSecret is required" $secrets.backofficeClientSecret | quote }}
  KEYCLOAK_DEMO_USER_PASSWORD: {{ required "secrets.demoUserPassword is required" $secrets.demoUserPassword | quote }}
  {{- range $service, $_ := .Values.serviceClients }}
  {{ include "keycloak.clientSecretEnvName" $service }}: {{ required (printf "secrets.serviceClientSecrets.%s is required" $service) (get $secrets.serviceClientSecrets $service) | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.clientSecretName" .Values.backofficeClient.service }}
  namespace: {{ .Values.backofficeClient.namespace }}
stringData:
  client-secret: {{ $secrets.backofficeClientSecret | quote }}
{{- range $service, $namespace := .Values.serviceClients }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.clientSecretName" $service }}
  namespace: {{ $namespace }}
stringData:
  client-secret: {{ get $secrets.serviceClientSecrets $service | quote }}
{{- end }}
{{- end }}
