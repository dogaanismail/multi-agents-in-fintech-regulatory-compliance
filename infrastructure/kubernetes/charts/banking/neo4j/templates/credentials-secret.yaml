{{- if .Values.createCredentialsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentialsSecret }}
type: Opaque
stringData:
  NEO4J_AUTH: {{ printf "neo4j/%s" (required "password is required when createCredentialsSecret is true" .Values.password) | quote }}
  username: neo4j
  password: {{ .Values.password | quote }}
{{- end }}
