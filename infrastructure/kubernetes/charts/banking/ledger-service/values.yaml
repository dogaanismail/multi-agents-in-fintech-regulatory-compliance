image:
  repository: ledger-svc

containerPort: 5013

jvm:
  extraOptions: --enable-native-access=ALL-UNNAMED

podSecurityContext:
  seccompProfile:
    type: Unconfined

env:
  SERVER_PORT: 5013
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  OTLP_TRACING_ENDPOINT: http://tempo.observability:4318/v1/traces
  TIGERBEETLE_CLUSTER_ID: 0
  TIGERBEETLE_ADDRESSES: tigerbeetle:3000

messaging:
  enabled: true
  consumes:
    ledger-posting-requested: ledger.posting.requested
  produces:
    ledger-posting-completed: ledger.posting.completed
    wallet-balance-changed: ledger.wallet.balance.changed
