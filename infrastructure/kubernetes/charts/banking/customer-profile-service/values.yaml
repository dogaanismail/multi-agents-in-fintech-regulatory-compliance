image:
  repository: customer-profile-svc-api

containerPort: 5008

env:
  SERVER_PORT: 5008
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  JAVA_OPTS: -Xmx256m
  OTLP_TRACING_ENDPOINT: http://tempo.observability:4318/v1/traces

datasource:
  enabled: true
  host: bank-postgres-rw
  database: customer_profile_db
  credentialsSecret: customer-profile-service-db-credentials

messaging:
  enabled: true
  consumes:
    payment-completed: payment-completed-events

migration:
  enabled: true
  image:
    repository: customer-profile-svc-db-migration-app
