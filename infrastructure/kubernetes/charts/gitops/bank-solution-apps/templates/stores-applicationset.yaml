apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: stores
  namespace: {{ .Release.Namespace }}
spec:
  goTemplate: true
  goTemplateOptions: [ "missingkey=error" ]
  generators:
    - list:
        elements:
          {{- range .Values.stores }}
          - name: {{ .name }}
            namespace: {{ .namespace }}
            chart: {{ .chart }}
          {{- end }}
  template:
    metadata:
      name: {{ "'{{ .name }}'" }}
      labels:
        bank-solution/kind: store
    spec:
      project: {{ .Values.project }}
      sources:
        - repoURL: {{ .Values.repoURL }}
          targetRevision: {{ .Values.targetRevision }}
          path: {{ printf "%s/{{ .chart }}" .Values.basePath | squote }}
          helm:
            releaseName: {{ "'{{ .name }}'" }}
            ignoreMissingValueFiles: true
            valueFiles:
              - {{ printf "$values/%s/data/{{ .namespace }}/{{ .name }}.yaml" .Values.basePath | squote }}
              - {{ printf "$values/%s/environments/%s/{{ .name }}.yaml" .Values.basePath .Values.environment | squote }}
        - repoURL: {{ .Values.repoURL }}
          targetRevision: {{ .Values.targetRevision }}
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ "'{{ .namespace }}'" }}
      syncPolicy:
        {{- toYaml .Values.syncPolicy | nindent 8 }}
