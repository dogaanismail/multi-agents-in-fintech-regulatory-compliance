replicaCount: 1

image:
  repository: ""
  tag: local
  pullPolicy: IfNotPresent

containerPort: 8000

env:
  LOG_LEVEL: info
  DEBUG: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability:4318

secretEnv: [ ]

datasource:
  enabled: false
  driver: sqlalchemy-asyncpg
  host: ai-postgres-rw
  port: 5432
  database: ""
  credentialsSecret: ""
  networkPeer: ai-postgres
  waitForDatabase:
    enabled: true
    image: ghcr.io/cloudnative-pg/postgresql:16

messaging:
  enabled: false
  bootstrapServers: bank-kafka-kafka-bootstrap.platform:9092
  schemaRegistryUrl: http://schema-registry.platform:8081
  topicEnvFormat: "%[2]s_TOPIC"
  consumes: { }
  produces: { }
  networkPeers:
    - kafka
    - schema-registry
  consumerGroup: ""
  transactionalIdPrefix: ""
  otherProducedTopics: [ ]
  authentication:
    enabled: false
    kafkaCluster: bank-kafka
    kafkaNamespace: platform
    securityProtocol: SASL_PLAINTEXT
    mechanism: SCRAM-SHA-512
    credentials: { }

migration:
  enabled: false
  command: [ ]
  backoffLimit: 6
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

writablePaths: [ ]
persistentPaths: [ ]

networkPolicy:
  enabled: true
  baseline:
    - dns
  ingress: [ ]
  egress: [ ]

probes:
  startup:
    httpGet:
      path: /api/v1/health
      port: http
    periodSeconds: 5
    failureThreshold: 60
  liveness:
    httpGet:
      path: /api/v1/health
      port: http
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /api/v1/health
      port: http
    periodSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

terminationGracePeriodSeconds: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
