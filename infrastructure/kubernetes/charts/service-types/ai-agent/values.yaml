replicaCount: 1

image:
  repository: ""
  tag: local
  pullPolicy: IfNotPresent

containerPort: 8000

env:
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability:4318

networkPolicy:
  enabled: true
  baseline:
    - dns
  ingress: [ ]
  egress: [ ]

probes:
  startup:
    httpGet:
      path: /api/v1/health
      port: http
    periodSeconds: 5
    failureThreshold: 36
  liveness:
    httpGet:
      path: /api/v1/health
      port: http
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /api/v1/health
      port: http
    periodSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 512Mi

terminationGracePeriodSeconds: 15

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
