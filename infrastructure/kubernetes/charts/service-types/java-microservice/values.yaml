replicaCount: 1

image:
  repository: ""
  tag: local
  pullPolicy: IfNotPresent

containerPort: 8080

jvm:
  enabled: true
  options: -Xms32m -Xmx192m -Xss512k -XX:ReservedCodeCacheSize=64m -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30
  extraOptions: ""

env:
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  OTLP_TRACING_ENDPOINT: http://tempo.observability:4318/v1/traces

secretEnv: []

datasource:
  enabled: false
  host: bank-postgres-rw
  port: 5432
  database: ""
  credentialsSecret: ""
  maxPoolSize: 5

messaging:
  enabled: false
  bootstrapServers: bank-kafka-kafka-bootstrap.platform:9092
  schemaRegistryUrl: http://schema-registry.platform:8081
  consumes: { }
  produces: { }

migration:
  enabled: false
  image:
    repository: ""
    tag: local
    pullPolicy: IfNotPresent
  backoffLimit: 6
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

probes:
  startup:
    httpGet:
      path: /actuator/health/liveness
      port: http
    periodSeconds: 5
    failureThreshold: 36
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    periodSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

terminationGracePeriodSeconds: 45

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
