server.port=${SERVER_PORT:3040}
spring.application.name=mobile-gateway-svc
banksolution.security.trusted-issuers=${CUSTOMER_TOKEN_ISSUER:http://keycloak:8180/realms/bank-customers}
banksolution.security.audiences=mobile-gateway
spring.security.oauth2.client.registration.bank-internal.client-id=mobile-gateway
spring.security.oauth2.client.registration.bank-internal.client-secret=${SERVICE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.bank-internal.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.bank-internal.token-uri=${KEYCLOAK_URL:http://keycloak:8180}/realms/bank-internal/protocol/openid-connect/token
integration.customer-service.url=${CUSTOMER_SERVICE_URL:http://localhost:5001}/api/v1/customers
integration.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:5002}/api/v1/accounts
integration.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:5003}/api/v1/payments
integration.payment-history-service.url=${PAYMENT_HISTORY_SERVICE_URL:http://localhost:5005}/api/v1/payment-history
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
