plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'jacoco'
}

group = 'org.bank.solution'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    api 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    compileOnly 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly "org.springframework.cloud:spring-cloud-starter-openfeign:${openFeignVersion}"

    testFixturesApi 'org.springframework.security:spring-security-test'
    testFixturesApi 'org.springframework.boot:spring-boot-webmvc-test'
    testFixturesCompileOnly "org.wiremock:wiremock-standalone:${wireMockStandaloneVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation "org.springframework.cloud:spring-cloud-starter-openfeign:${openFeignVersion}"
    testImplementation "org.wiremock:wiremock-standalone:${wireMockStandaloneVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}
