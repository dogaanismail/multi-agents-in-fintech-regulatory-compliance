# The integration context runs Liquibase (db-scheduler table) and lets Hibernate create the
# Axon event-store, token and saga tables against the Postgres container.
management.tracing.export.enabled=false
management.opentelemetry.tracing.export.otlp.enabled=false
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
logging.level.org.axonframework.modelling.saga=INFO
logging.level.org.banksolution.domain.payment.saga=INFO
logging.level.org.apache.kafka=WARN
