plugins {
    id 'org.springframework.boot' version "${springframeworkBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
    id 'java'
    id 'jacoco'
}

group = 'org.bank.solution'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        url "https://packages.confluent.io/maven/"
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation "org.springframework.cloud:spring-cloud-starter-openfeign:${openFeignVersion}"
    // Propagate W3C trace context across Feign HTTP calls (distributed tracing)
    implementation 'io.github.openfeign:feign-micrometer'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${openApiVersion}"

    implementation "org.axonframework:axon-spring-boot-starter:${axonVersion}"
    implementation "org.axonframework.extensions.kafka:axon-kafka-spring-boot-starter:${axonKafkaVersion}"
    implementation 'com.github.kagkarlsson:db-scheduler-spring-boot-starter:14.0.0'

    implementation 'org.springframework.kafka:spring-kafka'
    implementation "io.confluent:kafka-avro-serializer:${avroSerializerVersion}"
    implementation "org.apache.avro:avro:${apacheAvroVersion}"

    implementation project(':avro-schema-library-java')

    implementation project(':common')

    // vulnerabilities
    implementation "commons-fileupload:commons-fileupload:${commonsFileUploadVersion}"
    implementation 'io.grpc:grpc-netty-shaded:1.75.0'

    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.liquibase:liquibase-core'

    implementation 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation "org.axonframework:axon-test:${axonVersion}"
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.awaitility:awaitility'
}

springBoot {
    mainClass = 'org.banksolution.PaymentEngineServiceApplication'
}

test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    finalizedBy jacocoTestReport
}

tasks.register('integrationTest', Test) {
    description = 'Runs Testcontainers-based integration tests (requires a Docker daemon).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter test
    finalizedBy jacocoIntegrationTestReport
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('jacocoIntegrationTestReport', JacocoReport) {
    description = 'Coverage report over unit + integration test executions combined.'
    group = 'verification'
    mustRunAfter tasks.withType(Test)
    executionData fileTree(layout.buildDirectory).include('jacoco/*.exec')
    sourceSets sourceSets.main
    reports {
        xml.required = true
        html.required = true
    }
}

bootJar {
    enabled = true
}
