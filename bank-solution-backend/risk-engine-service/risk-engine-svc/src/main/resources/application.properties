spring.application.name=risk-engine-svc
banksolution.security.audiences=risk-engine-service,bank-platform
server.port=5006

# Database config
spring.datasource.url=${DB_SERVICE_URL:jdbc:postgresql://localhost:5433/risk_engine_db}
spring.datasource.username=${DB_SERVICE_USERNAME:default}
spring.datasource.password=${DB_SERVICE_PASSWORD:default}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.schema-registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
spring.kafka.consumer.group-id=risk-engine-group
spring.kafka.listener.auth-exception-retry-interval=${KAFKA_AUTH_EXCEPTION_RETRY_INTERVAL:10s}

# Kafka Topics
# Incoming events
spring.kafka.topics.incoming.risk-assessment-requested=risk.assessment.requested
spring.kafka.topics.incoming.fraud-analysis-completed=fraud.analysis.completed

# Outgoing events
spring.kafka.topics.outgoing.risk-assessment-completed=risk.assessment.completed
spring.kafka.topics.outgoing.fraud-analysis-requested=fraud.analysis.requested

# OpenFeign configuration
spring.cloud.openfeign.client.config.default.loggerLevel=BASIC
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.cloud.openfeign.client.config.default.connectTimeout=5000

integration.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:5002/api/v1/accounts}
integration.network-topology-service.url=${NETWORK_TOPOLOGY_SERVICE_URL:http://localhost:5007/api/v1/networks}
integration.customer-profile-service.url=${CUSTOMER-PROFILE_SERVICE_URL:http://localhost:5008/api/v1/customer-profiles}

# Actuator endpoints
springdoc.show-actuator=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=ALWAYS
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Server configuration for containerized environments
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── Distributed tracing (OpenTelemetry -> OTLP -> Jaeger) ──
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
spring.security.oauth2.client.registration.bank-internal.client-id=risk-engine-service
spring.security.oauth2.client.registration.bank-internal.client-secret=${SERVICE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.bank-internal.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.bank-internal.token-uri=${KEYCLOAK_URL:http://keycloak:8180}/realms/bank-internal/protocol/openid-connect/token
