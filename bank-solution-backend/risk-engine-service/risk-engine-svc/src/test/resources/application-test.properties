# The integration context runs the real Liquibase changelog against the Postgres
# container, then Hibernate validates the entities against the migrated schema.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=validate
management.tracing.export.enabled=false
management.opentelemetry.tracing.export.otlp.enabled=false
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
logging.level.wiremock=WARN
