plugins {
    id 'java-library'
    id 'jacoco'
}

group = 'org.bank.solution'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

dependencies {
    api "com.github.kagkarlsson:db-scheduler-spring-boot-4-starter:${dbSchedulerVersion}"

    testImplementation project(':scheduler-library:scheduler-db-migration-changelog')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'org.springframework.boot:spring-boot-starter-liquibase'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.awaitility:awaitility'
    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    finalizedBy jacocoTestReport
}

tasks.register('integrationTest', Test) {
    description = 'Runs Testcontainers-based integration tests (requires a Docker daemon).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter test
    finalizedBy jacocoIntegrationTestReport
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('jacocoIntegrationTestReport', JacocoReport) {
    description = 'Coverage report over unit + integration test executions combined.'
    group = 'verification'
    mustRunAfter tasks.withType(Test)
    executionData fileTree(layout.buildDirectory).include('jacoco/*.exec')
    sourceSets sourceSets.main
    reports {
        xml.required = true
        html.required = true
    }
}
