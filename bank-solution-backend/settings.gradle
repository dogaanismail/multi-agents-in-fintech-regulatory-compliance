pluginManagement {
    repositories {
        maven { url "https://plugins.gradle.org/m2/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'bank-solution-backend'

// common module
include 'common'

// avro schema library
include 'avro-schema-library-java'
project(':avro-schema-library-java').projectDir = file('../libraries/avro-schema-library/java')

// db-scheduler library
include 'scheduler-library'
include 'scheduler-library:scheduler'
include 'scheduler-library:scheduler-db-migration-changelog'

// transactional outbox library
include 'outbox-library'
include 'outbox-library:outbox'
include 'outbox-library:outbox-db-migration-changelog'

// service-to-service security library: JWT validation, permissions, client-credentials tokens for Feign
include 'security-library'
include 'security-library:service-security'

// customer service modules
include 'customer-service'
include 'customer-service:customer-svc'
include 'customer-service:customer-svc-db-migration'
include 'customer-service:customer-svc-db-migration-changelog'

// beneficiary service modules
include 'beneficiary-service'
include 'beneficiary-service:beneficiary-svc'
include 'beneficiary-service:beneficiary-svc-db-migration'
include 'beneficiary-service:beneficiary-svc-db-migration-changelog'

// account service modules
include 'account-service'
include 'account-service:account-svc'
include 'account-service:account-svc-db-migration'
include 'account-service:account-svc-db-migration-changelog'

// customer profile service modules
include 'customer-profile-service'
include 'customer-profile-service:customer-profile-svc'
include 'customer-profile-service:customer-profile-svc-db-migration'
include 'customer-profile-service:customer-profile-svc-db-migration-changelog'

// payment history service modules
include 'payment-history-service'
include 'payment-history-service:payment-history-svc'
include 'payment-history-service:payment-history-svc-db-migration'
include 'payment-history-service:payment-history-svc-db-migration-changelog'

// network topology service modules
include 'network-topology-service'
include 'network-topology-service:network-topology-svc'

// ledger service modules
include 'ledger-service'
include 'ledger-service:ledger-svc'

// payment engine service modules
include 'payment-engine-service'
include 'payment-engine-service:payment-engine-svc'

// risk engine service modules
include 'risk-engine-service'
include 'risk-engine-service:risk-engine-svc'
include 'risk-engine-service:risk-engine-svc-db-migration'
include 'risk-engine-service:risk-engine-svc-db-migration-changelog'

// payment service modules
include 'payment-service'
include 'payment-service:payment-svc'
include 'payment-service:payment-svc-db-migration'
include 'payment-service:payment-svc-db-migration-changelog'

include 'backoffice-gateway'
include 'backoffice-gateway:backoffice-gateway-svc'

// configuration service modules
include 'configuration-service'
include 'configuration-service:configuration-svc'
include 'configuration-service:configuration-svc-db-migration'
include 'configuration-service:configuration-svc-db-migration-changelog'